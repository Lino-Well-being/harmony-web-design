<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自分史ノート">
<title>自分史ノート</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 方眼ノートの1冊。上に名前と生まれ年、5つの手順をタブで進む。各手順は「書き方のコツ」→作業面の順 */
:root{
  --paper:#f7faef; --sheet:#ffffff; --grid:#e3edd2; --ink:#27331d; --muted:#5e6b50;
  --pen:#4e7d22; --pen-soft:#eaf3d5; --marker:#ffe27a; --marker-ink:#4a3b00;
  --line:#d2dfba; --warn:#b4432f; --ok:#2f7a4f;
  --c-work:#2b66a8; --c-private:#2f7a4f; --c-love:#b4527a; --c-hobby:#a8701e;
  --f-hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13190f; --sheet:#1b2415; --grid:#26321c; --ink:#e9efdf; --muted:#a2af8e;
  --pen:#b3d67a; --pen-soft:#2a3a1d; --marker:#e9c94a; --marker-ink:#2a2100;
  --line:#3a4a2b; --warn:#ec8a76; --ok:#7cc79a;
  --c-work:#7fb0ea; --c-private:#7cc79a; --c-love:#e597b8; --c-hobby:#e2b26a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13190f; --sheet:#1b2415; --grid:#26321c; --ink:#e9efdf; --muted:#a2af8e;
  --pen:#b3d67a; --pen-soft:#2a3a1d; --marker:#e9c94a; --marker-ink:#2a2100;
  --line:#3a4a2b; --warn:#ec8a76; --ok:#7cc79a;
  --c-work:#7fb0ea; --c-private:#7cc79a; --c-love:#e597b8; --c-hobby:#e2b26a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--f-hand);font-weight:600;text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:30px}
.beta{display:inline-block;vertical-align:middle;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--pen);background:var(--pen-soft);border:1px solid var(--pen);border-radius:999px;padding:1px 10px;margin-left:6px;letter-spacing:.05em}
.beta-note{color:var(--pen);margin:0} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:84px;line-height:1.7;font-size:16px}
textarea.big{min-height:320px}
.voice summary{cursor:pointer}
.voice ul{margin:6px 0 0}
input[type=number]{width:96px}
.privacy{font-size:12.5px;color:var(--muted);max-width:420px}
.ov{margin:4px 0 6px}
.ov-box{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.ov-box summary{cursor:pointer}
.ov-rows{display:grid;gap:4px;margin-top:8px}
.ov-row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:8px;align-items:center}
.ov-lab{font-size:12.5px;color:var(--muted);line-height:1.3}
.ov-n{text-align:right}
.ov-cells{display:flex;flex-wrap:wrap;gap:3px}
.ov-c{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--sheet);padding:0;font-size:10px;line-height:1;color:var(--marker-ink);cursor:pointer;font-style:normal}
.ov-c.lv1{background:var(--pen-soft);border-color:var(--line)}
.ov-c.lv2{background:#9cc46a;border-color:#86b153}
.ov-c.lv3{background:var(--pen);border-color:var(--pen);color:var(--marker)}
.ov-c.now{outline:2px solid var(--ink);outline-offset:1px}
.ov-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;align-items:center}
.ov-legend span{display:inline-flex;align-items:center;gap:4px}
.ov-legend .ov-c{width:12px;height:12px;cursor:default;font-size:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ov-c.lv2{background:#6f9640;border-color:#7fa84d}}
:root[data-theme="dark"] .ov-c.lv2{background:#6f9640;border-color:#7fa84d}
@media (max-width:520px){.ov-row{grid-template-columns:5.8em minmax(0,1fr) 2.6em;gap:6px}.ov-c{width:16px;height:16px}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 16px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab .n{font-family:var(--f-hand);font-weight:600;color:var(--pen)}
.tab[aria-selected=true]{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.tab[aria-selected=true] .n{color:var(--sheet)}
.intro{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.tip{background:var(--pen-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.tip strong{font-weight:700}
.tip ul{margin:6px 0 0;padding-left:1.2em}
.mic-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.mic{border:1px solid var(--pen);background:var(--sheet);color:var(--pen);border-radius:999px;padding:5px 14px;font-weight:500}
.mic.on{background:#c0392b;border-color:#c0392b;color:#fff}
.btn{border:1px solid var(--pen);background:var(--pen);color:var(--sheet);border-radius:8px;padding:7px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--pen)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:transparent}
.btn.sm{padding:3px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
/* 年表 */
.stage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stage-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.stage-h .ages{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hints{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.hint-col{font-size:12.5px;color:var(--muted);min-width:0}
.hint-col b{display:block;font-weight:700;margin-bottom:2px}
.chip{display:inline-block;border:1px dashed var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;background:transparent;font-size:12.5px;color:var(--muted)}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.add{display:grid;grid-template-columns:84px 150px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:6px}
.add input[type=number]{width:100%}
.ev{display:grid;grid-template-columns:96px 104px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--grid)}
.ev:first-child{border-top:0}
.ev .age{font-variant-numeric:tabular-nums;font-size:13.5px}
.ev .age .yr{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.t-work{color:var(--c-work)} .t-private{color:var(--c-private)} .t-love{color:var(--c-love)} .t-hobby{color:var(--c-hobby)}
.ev .txt{min-width:0;overflow-wrap:anywhere}
.ev .txt input{width:100%}
.ev .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--muted)}
.icon-btn[aria-pressed=true]{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.lock[aria-pressed=true]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px;padding:4px 0}
/* カーブ */
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:560px;height:auto}
.score-list .ev{grid-template-columns:96px minmax(0,1fr) 120px}
/* 深掘り */
.deep{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
.pick{display:flex;flex-direction:column;gap:4px;max-height:560px;overflow:auto;padding-right:4px}
.pick button{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;font-size:13.5px}
.pick button[aria-current=true]{border-color:var(--pen);box-shadow:inset 3px 0 0 var(--pen)}
.pick .grp{font-size:12px;color:var(--muted);margin-top:8px}
.ladder{display:flex;flex-direction:column;gap:12px}
.q{display:flex;flex-direction:column;gap:4px}
.q label{font-weight:500}
.q .sub{font-size:12.5px;color:var(--muted)}
.step-tag{font-family:var(--f-hand);color:var(--pen);font-weight:600;margin-right:6px}
/* 質問 */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;font-size:13.5px;color:var(--ink)}
.topic[aria-pressed=true]{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
.small.ok{color:var(--ok)}
.qcard{background:var(--pen-soft);border:1px solid var(--pen);border-left:6px solid var(--pen);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.qno{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0}
.qno b{background:var(--pen);color:var(--sheet);border-radius:999px;padding:0 10px;font-size:13px;font-family:var(--f-body)}
.qtext{font-size:19px;line-height:1.6}
.qcard .hint{font-size:13px;color:var(--muted);margin:0}
.ans-label{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 -6px}
.hl-box{border-top:1px dashed var(--grid);padding-top:10px}
.imp summary{cursor:pointer}
.imp-steps{margin:8px 0;padding-left:1.4em}
.imp textarea{width:100%;margin:6px 0}
.imp-item{border-top:1px dashed var(--grid);padding-top:8px}
.imp-item input[type=number]{width:5.5em}
.imp-pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;margin:6px 0 0;max-height:12em;overflow:auto}
.warn-t{color:var(--warn,#b3261e)}
.gap{border-top:2px dashed var(--line);margin-top:14px;padding-top:12px}
.gap details summary{cursor:pointer}
.qa-list{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.qa-list li.on>.linkish{font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--pen);text-align:left;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* マトリクス */
.axes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.matrix{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-top:10px}
.quad{position:relative}
.quad .cnt{position:absolute;right:6px;bottom:4px;font-size:11px;color:var(--muted)}
.mid{margin-top:6px;margin-left:30px;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
.mid .q-chip{font-size:12.5px;background:var(--pen-soft);border-radius:6px;padding:1px 7px}
.maps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.maps .btn[aria-pressed=true]{background:var(--pen);color:var(--sheet);border-color:var(--pen)}
.axrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 150px;gap:8px;align-items:end}
.quad{background:var(--sheet);border:1px solid var(--line);border-radius:8px;min-height:120px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.quad .q-chip{font-size:12.5px;background:var(--pen-soft);border-radius:6px;padding:1px 7px}
.ax-y{writing-mode:vertical-rl;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ax-x{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;grid-column:2 / 4}
.place{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px;gap:6px;align-items:center;padding:5px 0;border-top:1px dashed var(--grid);font-size:13.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
/* まとめ */
.out{width:100%;min-height:240px;font-size:13px;font-family:ui-monospace,Menlo,monospace;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:20}
.saved{font-size:12px;color:var(--ok)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--warn)}
@media (max-width:760px){
  .hints{grid-template-columns:repeat(2,minmax(0,1fr))}
  .add{grid-template-columns:72px minmax(0,1fr)}
  .add input[type=text]{grid-column:1 / -1}
  .add .btn{grid-column:1 / -1}
  .ev{grid-template-columns:72px minmax(0,1fr)}
  .ev .txt{grid-column:1 / -1}
  .ev .acts{grid-column:1 / -1;justify-content:flex-start}
  .score-list .ev{grid-template-columns:72px minmax(0,1fr)}
  .score-list .ev select{grid-column:1 / -1}
  .deep,.two{grid-template-columns:1fr}
  .pick{max-height:260px}
  .place{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .place .ptxt{grid-column:1 / -1}
  .axrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .axrow select{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <div class="stack" style="gap:6px">
      <h1>自分史ノート <span class="beta">ベータ版</span></h1>
      <p class="small beta-note">自分史シェア会の参加者向けの試用版です。使ってみた感想を、アンケートで聞かせてください。</p>
      <p class="muted small">質問に答える → 1年1ページで書き足す → ハイライトを選ぶ → 深掘りする → 自分の軸とキャッチコピー → 提出用と全体版にまとめる</p>
    </div>
    <div class="who">
      <div class="field"><label for="f-name">呼び名</label><input id="f-name" type="text" placeholder="例：はなこ" style="width:140px"></div>
      <div class="field"><label for="f-birth">生まれ年（西暦）</label><input id="f-birth" type="number" min="1920" max="2025" placeholder="1975"></div>
      <span id="saved" class="saved" aria-live="polite"></span>
    </div>
  </header>
  <p class="privacy">書いた内容は、この端末のブラウザの中にだけ保存されます。主催者にもほかの参加者にも見えません。「Cookieとサイトデータ」を消すと消えます。iPhoneのSafariは、7日ほど開かないと消えることがあるので、ホーム画面に追加して開くか、ときどき「7 まとめる」から控えを取ってください。</p>

  <section id="overview" class="ov" aria-label="進み具合"></section>

  <nav class="tabs" role="tablist" aria-label="手順">
    <button class="tab" role="tab" data-step="ask"><span class="n">1</span>質問に答える</button>
    <button class="tab" role="tab" data-step="years"><span class="n">2</span>1年1ページ</button>
    <button class="tab" role="tab" data-step="write"><span class="n">3</span>ハイライト</button>
    <button class="tab" role="tab" data-step="curve"><span class="n">4</span>気持ちの波</button>
    <button class="tab" role="tab" data-step="deep"><span class="n">5</span>深掘りする</button>
    <button class="tab" role="tab" data-step="oneword"><span class="n">6</span>自分の軸</button>
    <button class="tab" role="tab" data-step="summary"><span class="n">7</span>まとめる</button>
  </nav>

  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY="jibunshi-note-v1";
const COLS=[
  {k:"work",label:"仕事・学校"},
  {k:"private",label:"家族・暮らし"},
  {k:"love",label:"恋愛・大切な人"},
  {k:"hobby",label:"好きなこと・特技"}
];
const COL=Object.fromEntries(COLS.map(c=>[c.k,c.label]));
const STAGES=[
  {label:"生まれ〜幼稚園",from:0,to:5,hints:{work:["通っていた園","先生のひとこと"],private:["生まれた場所・育った町","家族の顔ぶれ","いちばん古い記憶"],love:["大好きだった人"],hobby:["夢中だった遊び","好きだった絵本・テレビ"]}},
  {label:"小学校",from:6,to:11,hints:{work:["好きな教科・苦手な教科","習いごと・塾","先生に言われて残っている言葉"],private:["家での役割","家族の出来事","やりたくてもできなかったこと"],love:["初恋","仲良しの友だち"],hobby:["夢中になったもの","ほめられたこと"]}},
  {label:"中学校",from:12,to:14,hints:{work:["部活","進路の決め方"],private:["家族との関係","初めて自分で決めたこと"],love:["好きだった人"],hobby:["ハマったもの","人に教えていたこと"]}},
  {label:"高校",from:15,to:17,hints:{work:["部活・役割","進路を選んだ理由"],private:["アルバイト","家の事情"],love:["恋愛"],hobby:["好きだった音楽・本"]}},
  {label:"学生時代・20代前半",from:18,to:24,hints:{work:["学校・専攻","就職先を選んだ理由","最初の仕事"],private:["一人暮らし・家族"],love:["恋愛・別れ"],hobby:["出会った本・人","続けていたこと"]}},
  {label:"20代後半〜30代",from:25,to:39,hints:{work:["異動・転職","評価されたこと","壁にぶつかったこと"],private:["結婚・パートナー","出産・子育て","住まい"],love:["パートナーとの関係"],hobby:["学び直し","再開したこと"]}},
  {label:"40代から今まで",from:40,to:120,hints:{work:["働き方を変えた理由","独立・挑戦"],private:["家族の変化","手放したもの"],love:["大切にしたい関係"],hobby:["今いちばん時間を使っていること"]}}
];
const LADDER=[
  {k:"fact",step:"事実",label:"いつ、どこで、誰と？",sub:"何歳・何年・場所・一緒にいた人。分からないところは「？」のままで大丈夫です。"},

function normalize(d){
  const b=blank();const o=Object.assign(b,d||{});
  o.magic=Object.assign(blank().magic,o.magic||{});
  o.catch=Object.assign(blank().catch,o.catch||{});
  const ys={};if(o.years&&typeof o.years==="object")for(const[k,v]of Object.entries(o.years)){const a=Math.round(+k);if(a>=0&&a<=120&&typeof v==="string")ys[a]=v;}
  o.years=ys;o.lastYear=Math.max(0,Math.min(120,Math.round(+o.lastYear||0)));
  o.events=Array.isArray(o.events)?o.events.filter(e=>e&&typeof e==="object").map(e=>({id:e.id||("e"+Math.random().toString(36).slice(2,8)),age:(e.age===""||e.age==null||isNaN(+e.age))?"":+e.age,col:COL[e.col]?e.col:"private",text:String(e.text||""),score:(e.score===""||e.score==null||isNaN(+e.score))?null:+e.score,star:!!e.star,priv:!!e.priv,deep:e.deep&&typeof e.deep==="object"?e.deep:{}})):[];
  o.seq=Math.max(+o.seq||1,o.events.length+1);
  normalizeMaps(o,d||{});
  const qa=(d&&d.qa&&typeof d.qa==="object")?d.qa:{};
  const obj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
  const qaA={};for(const[k,v]of Object.entries(obj(qa.a)))if(typeof v==="string"&&/^[a-z]+:\d+$/.test(k))qaA[k]=v;
  const flags=v=>{const r={};for(const[k,x]of Object.entries(obj(v)))if(x)r[k]=true;return r;};
  const c=obj(qa.cur);
  o.qa={a:qaA,skip:flags(qa.skip),priv:flags(qa.priv),cur:{t:typeof c.t==="string"?c.t:"birth",q:Math.max(0,+c.q||0)}};
  return o;
}
let saveTimer=null;
function normalizeMaps(o,d){
  const okX=v=>v==="L"||v==="C"||v==="R",okY=v=>v==="T"||v==="C"||v==="B";
  if(Array.isArray(d.maps)&&d.maps.length){
    o.maps=d.maps.filter(m=>m&&typeof m==="object").map((m,i)=>{
      const b=newMap(i+1),r=Object.assign(b,m);
      ["yT","yB","xL","xR","note"].forEach(k=>r[k]=String(r[k]==null?"":r[k]));
      if(r.theme!=="all"&&!COL[r.theme])r.theme="all";
      const pos={};if(m.pos&&typeof m.pos==="object")for(const[k,v]of Object.entries(m.pos)){if(v&&(okX(v.x)||okY(v.y)))pos[k]={x:okX(v.x)?v.x:"",y:okY(v.y)?v.y:""};}
      r.pos=pos;return r;});
    if(!o.maps.length)o.maps=[newMap(1)];
  }else{
    /* 旧版（軸1つ・出来事にmx/my）からの引き継ぎ */
    const m=newMap(1);m.theme="all";
    const ax=Object.assign({...OLD_AXES},d.axes||{});
    const isOld=Object.keys(OLD_AXES).every(k=>ax[k]===OLD_AXES[k]);
    if(!isOld){m.xL=ax.xL;m.xR=ax.xR;m.yT=ax.yT;m.yB=ax.yB;}
    (Array.isArray(d.events)?d.events:[]).forEach(e=>{
      if(!e||!e.id||!(e.mx||e.my))return;
      if(isOld)m.pos[e.id]={x:e.my==="T"?"R":e.my==="B"?"L":"",y:e.mx==="R"?"T":e.mx==="L"?"B":""};
      else m.pos[e.id]={x:okX(e.mx)?e.mx:"",y:okY(e.my)?e.my:""};
    });
    o.maps=[m];
  }
  o.maps.forEach((m,i)=>{if(!/^m\d+$/.test(m.id)||o.maps.findIndex(x=>x.id===m.id)!==i)m.id="m"+(100+i);});
  o.mapSeq=Math.max(+o.mapSeq||1,...o.maps.map(m=>+m.id.slice(1)+1));
  if(!o.maps.some(m=>m.id===o.curMap))o.curMap=o.maps[0].id;
  delete o.axes;
  o.events.forEach(e=>{delete e.mx;delete e.my;});
}
function curMapObj(){return S.maps.find(m=>m.id===S.curMap)||S.maps[0];}
function mapTitle(m){return `${m.theme==="all"?"すべて":COL[m.theme]}｜${m.yT}↔${m.yB} × ${m.xL}↔${m.xR}`;}
function mapPlaced(m,withPriv){
  const ev=new Map(S.events.map(e=>[e.id,e]));
  const k=e=>e.age===""?999:e.age;
  return Object.entries(m.pos).map(([id,p])=>({e:ev.get(id),p})).filter(o=>o.e&&(o.p.x||o.p.y)&&(m.theme==="all"||o.e.col===m.theme)&&(withPriv||!o.e.priv)).sort((a,b)=>k(a.e)-k(b.e));
}
function posWord(m,p){
  const y=p.y==="T"?m.yT:p.y==="B"?m.yB:p.y==="C"?"どちらとも言えない":"—";
  const x=p.x==="L"?m.xL:p.x==="R"?m.xR:p.x==="C"?"どちらとも言えない":"—";
  return `${y}・${x}`;
}
function mapLines(withPriv){
  const out=[];
  S.maps.forEach(m=>{
    const pl=mapPlaced(m,withPriv);
    if(!pl.length&&!(m.note||"").trim())return;
    out.push("",`■ 題材：${m.theme==="all"?"すべて":COL[m.theme]}（縦：${m.yT}↔${m.yB}／横：${m.xL}↔${m.xR}）`);
    pl.forEach(({e,p})=>out.push(`- ${e.age===""?"":e.age+"歳　"}${e.text}：${posWord(m,p)}`));
    if((m.note||"").trim())out.push(`気づき：${m.note.trim().replace(/\n+/g," ")}`);
  });
  return out;
}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==="class")el.className=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="text")el.textContent=v;
    else if(k==="value")el.value=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  return el;
}

function buildTopicDoc(){

function buildTopics(withPriv,heading){
  const out=[];
  TOPICS.forEach(t=>{
    if(S.qa.skip[t.k])return;
    if(S.qa.priv[t.k]&&!withPriv)return;
    const qs=t.qs.map(([q],i)=>[q,qaAns(t.k,i)]).filter(x=>x[1]);
    if(!qs.length)return;
    out.push("",`${heading} ${t.label}${S.qa.priv[t.k]?"［非公開］":""}`);
    qs.forEach(([q,a])=>out.push("",`Q. ${q}`,a.split("\n").map(l=>l.trim()).filter(Boolean).join("\n")));
  });
  return out;
}

const SCAN_PROMPT=`添付した写真は、私が手書きで書いた自分史のノートです。次のルールで、文字に書き起こしてください。
・書いてあるとおりに書き写す。言葉を足したり、整えたり、要約したりしない

・年齢や年ごとに、見出しを行の頭に「■ 14歳」または「■ 1985年」の形で付ける。ノートに書いてある年齢・年に合わせる
・年齢も年も書いていない部分は、「■ 年がわからない」の見出しの下にまとめる
・写真が何枚かあるときは、写真の順番どおりに続けて書く
・見出しと書き起こした文だけを出す。説明やまとめは付けない`;

function zen2han(s){return s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));}
function parseImport(src){
  const chunks=[];let cur=null;
  const push=(label,age)=>{cur={label,age,lines:[]};chunks.push(cur);};
  src.replace(/\r/g,"").split("\n").forEach(raw=>{
    const line=zen2han(raw).trim();
    const dated=/\d{1,4}\s*(歳|才|年)/;
    const hm=line.match(/^(?:■|#{1,4})\s*(.*)$/),bm=line.match(/^【([^】]*)】$/);
    const head=hm?hm[1]:(bm&&dated.test(bm[1]))?bm[1]:(/^\d{1,4}\s*(歳|才|年)/.test(line)&&line.length<=16)?line:null;
    if(head!=null){
      const am=head.match(/(\d{1,3})\s*(?:歳|才)/),ym=head.match(/((?:19|20)\d\d)\s*年?/);
      let age=null;
      if(am)age=+am[1];else if(ym&&birth())age=+ym[1]-birth();
      if(age!=null&&(age<0||age>120))age=null;
      push(head.replace(/^[■#\s]+/,"")||"見出しなし",age);return;
    }
    if(!cur){if(!line)return;push("見出しの前の部分",null);}
    cur.lines.push(raw.replace(/\s+$/,""));

}

function parseGap(src){
  const items=[];let cur=null;
  src.replace(/\r/g,"").split("\n").forEach(raw=>{
    const line=zen2han(raw).trim();
    const m=line.match(/^[［\[](\d{1,2})\s*[-－ー‐]\s*(\d{1,2})[］\]]\s*(.*)$/);
    if(m){
      const t=TOPICS[+m[1]-1],qi=+m[2]-1;
      cur=t&&t.qs[qi]?{t:t.k,qi,label:t.label,q:t.qs[qi][0],lines:[]}:null;
      if(cur)items.push(cur);return;
    }
    if(!cur)return;
    cur.lines.push(raw.replace(/^\s*(答え|A)\s*[：:]\s*/,"").replace(/\s+$/,""));
  });
  return items.map(c=>({t:c.t,qi:c.qi,label:c.label,q:c.q,text:c.lines.join("\n").replace(/^\n+|\n+$/g,"")})).filter(c=>c.text.trim());
}

/* ---------- 音声入力ボタン（ブラウザの音声認識） ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micRec=null,micBtnEl=null;
function micStop(){if(micRec){try{micRec.stop();}catch(_){}}}
function micRow(ta){
  if(!SR)return null;
  const st=h("span",{class:"small muted"});
  const b=h("button",{class:"mic",type:"button",text:"🎤 話して入れる",onclick:()=>{
    if(micRec&&micBtnEl===b){micStop();return;}
    micStop();
    const r=new SR();r.lang="ja-JP";r.continuous=true;r.interimResults=true;
    micRec=r;micBtnEl=b;
    r.onresult=ev=>{
      if(!ta.isConnected){micStop();return;}
      let fin="",mid="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)fin+=t;else mid+=t;}
      if(fin){
        const pos=ta.selectionEnd??ta.value.length;
        ta.value=ta.value.slice(0,pos)+fin+ta.value.slice(pos);
        ta.selectionStart=ta.selectionEnd=pos+fin.length;
        ta.dispatchEvent(new Event("input",{bubbles:true}));
      }
      st.textContent=mid?"聞き取り中："+mid:"";
    };
    r.onerror=ev=>{
      if(ev.error==="not-allowed"||ev.error==="service-not-allowed")toast("マイクの使用を許可してください（アドレスバーの左のマークから）");
      else if(ev.error==="no-speech")toast("声が聞き取れませんでした。もう一度押して話してください");
      else if(ev.error!=="aborted")toast("音声入力がうまく動きませんでした。下の説明の方法でも話せます");
    };
    r.onend=()=>{if(micRec===r){micRec=null;micBtnEl=null;}b.classList.remove("on");b.textContent="🎤 話して入れる";st.textContent="";};
    try{r.start();}catch(_){toast("音声入力を始められませんでした");return;}
    b.classList.add("on");b.textContent="■ 止める";st.textContent="話してください。終わったら「止める」を押します";
  }});
  return h("div",{class:"mic-row"},b,st);
}

function chartSVG(){

  const maxAge=Math.max(currentAge()||0,...S.events.filter(e=>e.age!=="").map(e=>e.age),40);
  const top=Math.ceil(maxAge/10)*10;
  const x=a=>L+(a/top)*(W-L-R), y=s=>T+((5-s)/10)*(H-T-B);
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("role","img");
  svg.setAttribute("aria-label","年齢ごとの充実度の線グラフ");
  const el=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.append(e);return e;};

  el("text",{x:L-10,y:y(5)+5,"text-anchor":"end","font-size":15,fill:"var(--muted)"},"+5");
  el("text",{x:L-10,y:y(0)+5,"text-anchor":"end","font-size":15,fill:"var(--muted)"},"0");
  el("text",{x:L-10,y:y(-5)+5,"text-anchor":"end","font-size":15,fill:"var(--muted)"},"−5");
  for(let a=0;a<=top;a+=10){
    el("line",{x1:x(a),x2:x(a),y1:T,y2:H-B,stroke:"var(--grid)","stroke-width":1});
    el("text",{x:x(a),y:H-B+24,"text-anchor":"middle","font-size":15,fill:"var(--muted)"},a===0?"0歳":a+"代");
  }
  el("text",{x:14,y:T+4,"font-size":14,fill:"var(--muted)"},"充実度");
  if(pts.length<2){
    el("text",{x:W/2,y:H/2-8,"text-anchor":"middle","font-size":18,fill:"var(--muted)"},pts.length?"あと1つ以上、充実度を付けると線になります":"下の一覧で充実度を付けると、ここに線が引かれます");
    pts.forEach(p=>el("circle",{cx:x(p.age),cy:y(p.score),r:6,fill:"var(--pen)"}));
    return svg;

    c1[1]=Math.max(T,Math.min(H-B,c1[1]));c2[1]=Math.max(T,Math.min(H-B,c2[1]));
    d+=` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }

  pts.forEach((p,i)=>{

    const ty=above?cy-14:cy+24;

    el("text",{x:tx,y:Math.max(T+12,Math.min(H-B-6,ty)),"text-anchor":"middle","font-size":14,fill:"var(--ink)"},label);
  });
  return svg;
}
function turningPoints(){
  const pts=sorted(S.events.filter(e=>e.age!==""&&e.score!=null));
  const out=[];
  pts.forEach((p,i)=>{
    const prev=pts[i-1];

  });
  return out;
}

  if(!evs.length)place.append(h("p",{class:"empty",text:mp.theme==="all"?"「3 ハイライト」に出来事を書くと、ここで4つのマスに分けられます。":`「${COL[mp.theme]}」の出来事がまだありません。題材を変えるか、「3 ハイライト」に書き足してください。`}));
  evs.forEach(e=>{
    const p=mp.pos[e.id]||{x:"",y:""};
    const set=(k,v)=>{const n=Object.assign({x:"",y:""},mp.pos[e.id]||{});n[k]=v;if(!n.x&&!n.y)delete mp.pos[e.id];else mp.pos[e.id]=n;save();render();};
    const sy=h("select",{"aria-label":"縦軸"},h("option",{value:""},"縦：—"),h("option",{value:"T",selected:p.y==="T"},mp.yT),h("option",{value:"C",selected:p.y==="C"},"真ん中"),h("option",{value:"B",selected:p.y==="B"},mp.yB));
    const sx=h("select",{"aria-label":"横軸"},h("option",{value:""},"横：—"),h("option",{value:"R",selected:p.x==="R"},mp.xR),h("option",{value:"C",selected:p.x==="C"},"真ん中"),h("option",{value:"L",selected:p.x==="L"},mp.xL));
    sy.addEventListener("change",()=>set("y",sy.value));
    sx.addEventListener("change",()=>set("x",sx.value));
    place.append(h("div",{class:"place"},h("span",{class:"ptxt",text:`${ageLabel(e)}　${e.text}`}),sy,sx));
  });
  mxBox.append(place);

  /* 気づき */
  const nid="mx-note-"+mp.id;
  const note=h("textarea",{id:nid,rows:"3",value:mp.note,placeholder:"例：仕事では、苦しくても自分のためになることを選んできた。これが私の仕事観。"});
  note.addEventListener("input",()=>{mp.note=note.value;save();});
  mxBox.append(h("div",{class:"q"},
    h("label",{for:nid,text:"一言で言うと、これが私の「〇〇観」"}),
    h("span",{class:"sub",text:"いちばん多く集まったマスはどこ？ そこに共通するものは？ 逆に、すぐやめてしまったものはどのマス？"}),
    note));
  return mxBox;
}

/* ---------- 6 まとめる ---------- */

    "「提出用ハイライト」は、ハイライトを時代ごとの箇条書きにしたものです。非公開の出来事は外れます。A4で4ページ以内が目安です。",
    "「全体ドキュメント」は、1年1ページの書き写しも深掘りも全部入った、自分用の時系列の記録です。発信のネタや、これからのサービスの種を探すときに使えます。",
    "「AIに貼る文」を ChatGPT や Claude に貼ると、AIが一問ずつ質問しながら足りないところを埋め、提出用・キャッチコピー案・全体版・発信ネタまで一緒に作ってくれます。"
  ])));

  const topTA=h("textarea",{class:"out",readonly:true,"aria-label":"トピック別の自分史"});
  const aiTA=h("textarea",{class:"out",readonly:true,"aria-label":"AIに貼る文"});
  const meter=h("span",{class:"small"});

    const pg=pagesOf(subTA.value);

  };
  inclPriv.addEventListener("change",refresh);inclYears.addEventListener("change",refresh);refresh();

  box.append(h("div",{class:"sheet stack"},
    h("div",{class:"row",style:"justify-content:space-between"},h("h2",{text:"提出用ハイライト"}),
      h("div",{class:"row"},copyBtn(()=>subTA.value,subTA),saveBtn(()=>subTA.value,base+"自分史ハイライト.md","text/markdown"))),
    meter,
    h("p",{class:"small muted",text:"4ページを超えたら、「3 ハイライト」で似た出来事をまとめるか、非公開にして外してください。"}),

  box.append(h("div",{class:"sheet stack"},
    h("div",{class:"row",style:"justify-content:space-between"},h("h2",{text:"トピック別の自分史（大まかな版）"}),
      h("div",{class:"row"},copyBtn(()=>topTA.value,topTA),saveBtn(()=>topTA.value,base+"自分史・トピック別.md","text/markdown"))),
    h("p",{class:"small muted",text:"「1 質問に答える」の答えを、トピックごとに並べたものです。非公開にしたトピックも［非公開］の印つきで入っています。"}),
    topTA));
  box.append(h("div",{class:"sheet stack"},
    h("div",{class:"row",style:"justify-content:space-between"},h("h2",{text:"全体ドキュメント（自分用・時系列）"}),
      h("div",{class:"row"},copyBtn(()=>fullTA.value,fullTA),saveBtn(()=>fullTA.value,base+"自分史・全体.md","text/markdown"))),
    h("p",{class:"small muted",text:"非公開の出来事も［非公開］の印つきで入っています。人に渡すときは提出用を使ってください。"}),
    fullTA));
  box.append(h("div",{class:"sheet stack"},
    h("div",{class:"row",style:"justify-content:space-between"},h("h2",{text:"AIに貼る文"}),

    h("label",{class:"row small",for:"incl-years"},inclYears,"1年1ページの書き写しも入れる"),
    h("label",{class:"row small",for:"incl-priv"},inclPriv,"非公開にした出来事も入れる（自分だけが使うAIのとき）"),
    aiTA));
  const restore=h("textarea",{class:"out",style:"min-height:90px","aria-label":"控えを貼り付ける",placeholder:"別の端末で取った控え（データ）をここに貼り付けて「読み込む」"});
  const msg=h("p",{class:"small muted","aria-live":"polite"});
  box.append(h("div",{class:"sheet stack"},

    restore,

      try{const d=normalize(JSON.parse(restore.value));if(!d.events.length&&!d.name){msg.textContent="控えの形が読めませんでした。コピーした文字をそのまま貼ってください。";return;}
        S=d;curDeep=null;save();fName.value=S.name;fBirth.value=S.birth;toast("控えを読み込みました");render();}
      catch(e){msg.textContent="控えの形が読めませんでした。コピーした文字をそのまま貼ってください。";}

let resetArmed=false;
function resetBlock(){
  return resetArmed
    ?h("div",{class:"confirm"},"全部消して白紙に戻しますか？",h("button",{class:"btn warn sm",type:"button",onclick:()=>{S=blank();resetArmed=false;curDeep=null;save();fName.value="";fBirth.value="";render();toast("白紙に戻しました");}},"全部消す"),h("button",{class:"btn ghost sm",type:"button",onclick:()=>{resetArmed=false;render();}},"やめる"))
    :h("div",null,h("button",{class:"btn warn sm",type:"button",onclick:()=>{resetArmed=true;render();}},"白紙に戻す"));
}
function copyBtn(get,ta,label){
  return h("button",{class:"btn sm",type:"button",onclick:async()=>{
    const t=get();
    try{await navigator.clipboard.writeText(t);toast("コピーしました");}
    catch(e){if(ta){ta.focus();ta.select();toast("選択しました。コピーしてください");}else toast("コピーできませんでした");}
  }},label||"コピー");
}
let dl=null;
function saveBtn(get,filename,type,label){
  const plain=!window.claude;
  const b=h("button",{class:"btn ghost sm",type:"button",hidden:!dl&&!plain,onclick:async()=>{
    const blob=new Blob([get()],{type:type+";charset=utf-8"});
    if(dl){try{await dl.save({filename,data:blob});}catch(e){toast("保存しませんでした");}return;}
    if(plain){const u=URL.createObjectURL(blob);const a=h("a",{href:u,download:filename});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
  }},label||"ファイルに保存");
  b.dataset.dl="1";return b;
}
function lineOfEvent(e,withPriv){
  const y=yearOf(e.age);
  return `- ${e.age===""?"年齢不明":e.age+"歳"}${y?"（"+y+"年）":""}［${COL[e.col]}］${e.text}${e.score!=null?"（充実度 "+(e.score>0?"+":"")+e.score+"）":""}${withPriv&&e.priv?"［非公開］":""}`;
}
function deepText(e){
  return LADDER.filter(q=>(e.deep[q.k]||"").trim()).map(q=>`  - ${q.step}：${e.deep[q.k].trim().replace(/\n+/g," ")}`).join("\n");
}
function pagesOf(t){
  const CH=38,LINES=36;
  const n=t.split("\n").reduce((acc,l)=>acc+Math.max(1,Math.ceil(l.length/CH)),0);
  return n/LINES;
}
function stageHead(i){
  const st=STAGES[i],b=birth();
  const ages=st.to>100?`${st.from}歳〜`:`${st.from}〜${st.to}歳`;
  const yrs=b?(st.to>100?`・${b+st.from}年〜`:`・${b+st.from}〜${b+st.to}年`):"";
  return `## ${st.label}（${ages}${yrs}）`;
}
function hlLine(e){
  const y=yearOf(e.age);
  return `- ${e.age===""?"":e.age+"歳"}${y?"（"+y+"年）":""}${e.age===""?"":"　"}${e.text}`;
}
function buildSubmit(){
  const out=[];
  out.push(`# ${S.name?S.name+"の":""}自分史ハイライト`);
  const meta=[];if(birth())meta.push(`${birth()}年生まれ`);
  if(meta.length)out.push(meta.join("・"));
  if((S.catch.line||"").trim())out.push("",`キャッチコピー：${S.catch.line.trim()}`);
  const evs=sorted(S.events.filter(e=>!e.priv));
  if(!evs.length){out.push("","（ハイライトはまだありません）");return out.join("\n");}
  STAGES.forEach((st,i)=>{
    const g=evs.filter(e=>stageOf(e.age)===i);
    if(g.length){out.push("",stageHead(i));g.forEach(e=>out.push(hlLine(e)));}
  });
  const un=evs.filter(e=>e.age==="");
  if(un.length){out.push("","## 時期が分からないもの");un.forEach(e=>out.push(hlLine(e)));}
  const m=S.magic,mm=[["得意なこと",m.good],["求めているもの",m.seek],["強み",m.s1],["相手に届けられること",m.s2],["実現したこと",m.s3]].filter(x=>(x[1]||"").trim());
  if(mm.length){out.push("","## いまの私");mm.forEach(x=>out.push(`- ${x[0]}：${x[1].trim().replace(/\n+/g," ")}`));}
  return out.join("\n");
}
function buildFull(){
  const out=[];
  out.push(`# ${S.name?S.name+"の":""}自分史（全体・時系列）`);
  if(birth())out.push(`${birth()}年生まれ`);
  if((S.catch.line||"").trim())out.push("","## キャッチコピー",S.catch.line.trim());
  const m=S.magic,mm=[["得意なこと（一言）",m.good],["人生で求めているもの",m.seek],["人より優れていること",m.s1],["相手に届けられること",m.s2],["実現したこと（実績）",m.s3]].filter(x=>(x[1]||"").trim());
  if(mm.length){out.push("","## 自分を一言で・強み");mm.forEach(x=>out.push(`- ${x[0]}：${x[1].trim().replace(/\n+/g," ")}`));}
  const ages=new Set([...Object.keys(S.years).filter(k=>(S.years[k]||"").trim()).map(Number),...S.events.filter(e=>e.age!=="").map(e=>e.age)]);
  const list=[...ages].sort((x,y)=>x-y);
  out.push("","## 年ごとの記録");
  if(!list.length)out.push("（まだありません）");
  let lastStage=-1;
  list.forEach(a=>{
    const si=stageOf(a);
    if(si!==lastStage&&si>=0){out.push("",`### ${STAGES[si].label}`);lastStage=si;}
    const y=yearOf(a);
    out.push("",`#### ${a}歳${y?"（"+y+"年）":""}`);
    const t=(S.years[a]||"").trim();if(t)out.push(t);
    const hl=S.events.filter(e=>e.age===a);
    if(hl.length){out.push("","ハイライト：");hl.forEach(e=>{
      out.push(`- ［${COL[e.col]}］${e.text}${e.score!=null?"（充実度 "+(e.score>0?"+":"")+e.score+"）":""}${e.priv?"［非公開］":""}`);
      const d=deepText(e);if(d)out.push(d);
    });}
  });
  const un=S.events.filter(e=>e.age==="");
  if(un.length){out.push("","### 時期が分からないもの");un.forEach(e=>{out.push(`- ［${COL[e.col]}］${e.text}${e.priv?"［非公開］":""}`);const d=deepText(e);if(d)out.push(d);});}
  const seeds=sorted(S.events.filter(e=>e.star||(e.deep.now||"").trim()||(e.deep.reframe||"").trim()));
  out.push("","## 発信ネタの種");
  out.push(seeds.length?seeds.map(e=>{const k=((e.deep.reframe||"").trim()||(e.deep.now||"").trim()).replace(/\n+/g," ");return `- ${e.age===""?"":e.age+"歳　"}${e.text}${k?" → "+k:""}${e.priv?"［非公開］":""}`;}).join("\n"):"（「5 深掘りする」で「今へ」「見直す」を書くと、ここに並びます）");
  out.push("","## これからのサービスのストック");
  const sv=[["強み",m.s1],["届けられること",m.s2],["実績",m.s3],["求めているもの",m.seek]].filter(x=>(x[1]||"").trim());
  out.push(sv.length?sv.map(x=>`- ${x[0]}：${x[1].trim().replace(/\n+/g," ")}`).join("\n"):"（「6 自分の軸」の強みの3つの文を書くと、ここに並びます）");
  const tq=buildTopics(true,"###");
  if(tq.length)out.push("","## 質問への答え（トピック別）",...tq);
  const ml=mapLines(true);
  if(ml.length)out.push("","## 自分理解マトリクス",...ml.map(l=>l.startsWith("■ ")?"### "+l.slice(2):l));
  const turns=turningPoints();
  if(turns.length){out.push("","## 人生の曲がり角（気持ちの波から）");turns.forEach(e=>out.push(`- ${e.age}歳　${e.text}（充実度 ${(e.score>0?"+":"")+e.score}）`));}
  return out.join("\n");
}
function buildAI(withPriv,withYears){
  const evs=sorted(S.events.filter(e=>withPriv||!e.priv));
  const out=[];
  out.push("あなたは、私の自分史づくりを手伝う聞き手です。下にあるのは、私が書き出した自分史のメモです。次のルールで進めてください。",
  "",
  "1. 質問は一度に1つだけにしてください。私が答えてから、次の質問に進んでください。",
  "2. メモにないことを推測で書かないでください。分からないところは空白として残し、最後に一覧にしてください。",
  "3. 年は生まれ年から計算し、年齢と年が合わないところや、話の食い違いがあれば、私に確認してください。",
  "4. 私の言葉は、できるだけそのまま使ってください。言い換えたときは、そう伝えてください。",
  "5. 出来事ごとに「事実 → そのときの気持ち → 理由 → 今の自分につながっていること」の順に聞いてください。",
  "6. つらい出来事は責めずに聞いてください。今の私から見た意味（選んだこと、学んだこと、感謝していること）も一緒に考えてください。無理に前向きにはしないでください。",
  "7. 人に見せたくない話が出たら、まとめに入れてよいかを確認してください。",
  "8. 最初に、深掘りすると良さそうな出来事を3つ選んで、理由と一緒に教えてください。そのあと質問を始めてください。",
  "9. 空白がだいたい埋まったら、次の4つを作ってください。",
  "   A. 提出用：時代ごとのハイライトの箇条書き（A4で4ページ以内）",
  "   B. キャッチコピーの候補を5つ（経験・強み・届けたい相手が入るもの）と、それぞれの理由。自分理解マトリクスがあれば、どのマスに出来事が集まっているかから、私が選んできたもの（私の軸）も一言で添えてください",
  "   C. 全体を時系列にまとめた自分史（一人称「私」、章立てと年表つき）",
  "   D. この自分史から作れる発信のネタを10個と、これからのサービスの種を3つ",
  "",
  "---",
  `呼び名：${S.name||"（未記入）"}`,
  `生まれ年：${birth()?birth()+"年":"（未記入）"}`);
  if((S.catch.line||"").trim())out.push(`今のキャッチコピー（下書き）：${S.catch.line.trim()}`);
  out.push("","【ハイライト】",evs.length?evs.map(e=>lineOfEvent(e,withPriv)).join("\n"):"（まだありません）");
  const deep=evs.filter(e=>deepText(e));
  if(deep.length){out.push("","【深掘りしたメモ】");deep.forEach(e=>{out.push(`■ ${e.age===""?"":e.age+"歳　"}${e.text}`,deepText(e));});}
  const m=S.magic;
  const mm=[["得意なこと（一言）",m.good],["求めているもの",m.seek],["優れていること",m.s1],["相手に届けられること",m.s2],["実現したこと",m.s3]].filter(x=>(x[1]||"").trim());
  if(mm.length){out.push("","【自分を一言で・強み（下書き）】");mm.forEach(x=>out.push(`- ${x[0]}：${x[1].trim()}`));}
  const tq=buildTopics(withPriv,"■");
  if(tq.length)out.push("","【質問への答え（トピック別）】",...tq);
  const ml=mapLines(withPriv);
  if(ml.length)out.push("","【自分理解マトリクス（出来事を2本の軸で4つに分けたもの）】",...ml);
  if(withYears){
    const ys=Object.keys(S.years).map(Number).filter(a=>(S.years[a]||"").trim()).sort((x,y)=>x-y);
    if(ys.length){out.push("","【1年1ページの書き写し】");ys.forEach(a=>{const y=yearOf(a);out.push("",`■ ${a}歳${y?"（"+y+"年）":""}`,S.years[a].trim());});}
  }
  return out.join("\n");
}
